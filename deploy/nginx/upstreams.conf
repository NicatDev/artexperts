# Docker's internal DNS keeps upstream addresses current after container replacement.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream artexperts_backend {
  zone artexperts_backend 64k;
  server backend:8000 resolve;
}
upstream artexperts_frontend {
  zone artexperts_frontend 64k;
  server frontend:3000 resolve;
}
