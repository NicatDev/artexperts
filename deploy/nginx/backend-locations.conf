client_max_body_size 55m;
# Private PDF files and master images are served only by permission-checked API endpoints.
location ^~ /media/private/ { return 404; }
location /media/ {
  alias /srv/media/;
  add_header X-Content-Type-Options nosniff;
}
location /static/ { alias /srv/static/; }
location / {
  proxy_pass http://artexperts_backend;
  include /etc/nginx/artexperts/proxy-headers.conf;
}
