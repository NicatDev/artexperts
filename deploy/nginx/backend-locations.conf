# 300 MB PDF + 25 MB cover + multipart fields and boundary overhead.
client_max_body_size 330m;
client_body_timeout 300s;
# Resumable PDF chunks stay below the Cloudflare and web-worker body limits.
location ^~ /api/v1/books/uploads/ {
  client_max_body_size 10m;
  proxy_request_buffering on;
  proxy_pass http://artexperts_backend;
  include /etc/nginx/artexperts/proxy-headers.conf;
}
# Private PDF files and master images are served only by permission-checked API endpoints.
location ^~ /media/private/ { return 404; }
location /media/ {
  alias /srv/media/;
  add_header X-Content-Type-Options nosniff;
}
location /static/ { alias /srv/static/; }
location / {
  proxy_pass http://artexperts_backend;
  include /etc/nginx/artexperts/proxy-headers.conf;
}
