server {
  listen 80;
  server_name artexperts.net app.artexperts.net;
  location = /nginx-health { access_log off; return 200 'ok'; }
  location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl;
  server_name artexperts.net;
  ssl_certificate /etc/letsencrypt/live/artexperts.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/artexperts.net/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  location / {
    proxy_pass http://artexperts_frontend;
    include /etc/nginx/artexperts/proxy-headers.conf;
  }
}
server {
  listen 443 ssl;
  server_name app.artexperts.net;
  ssl_certificate /etc/letsencrypt/live/artexperts.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/artexperts.net/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  include /etc/nginx/artexperts/backend-locations.conf;
}
