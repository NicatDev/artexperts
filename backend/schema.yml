        '200':
          description: No response body
  /api/v1/pages/home-overview/:
    get:
      operationId: pages_home_overview_retrieve
      description: |-
        Optimized aggregation endpoint for Homepage loading.
        Returns:
        - hero_banner
        - featured_artworks (limit 6)
        - featured_articles (limit 3)
        - featured_books (limit 4)
        - founder_intro
      tags:
      - pages
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/pages/settings/:
    get:
      operationId: pages_settings_retrieve
      tags:
      - pages
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
