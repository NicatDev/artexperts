  /api/v1/search/:
    get:
      operationId: search_retrieve
      description: Cross-domain unified search across artists, artworks, books, and
        articles.
      tags:
      - search
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/seo/sitemap/:
    get:
      operationId: seo_sitemap_retrieve
      description: |-
        Dedicated endpoint returning all public, published, non-deleted URLs
        for Next.js sitemap.xml generation.
      tags:
      - seo
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/users/lookup/:
    get:
      operationId: users_lookup_retrieve
      description: |-
        Protected email existence check for granting book access.
        Rate-limited, does not expose full user lists.
      tags:
      - users
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
components:
  schemas:
    ArticleCategory:
      type: object
      properties:
        id:
