          description: ''
  /api/v1/books/{id}/download/:
    get:
      operationId: books_download_retrieve
      description: |-
        Strict server-side authorized book file download.
        Never exposes direct media files statically.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - books
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/books/{id}/grant-access/:
    post:
      operationId: books_grant_access_create
      description: Owner or Admin grants private download permission to a specific
        registered user.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - books
      requestBody:
