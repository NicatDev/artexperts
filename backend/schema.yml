                $ref: '#/components/schemas/PaginatedArtworkCategoryList'
          description: ''
  /api/v1/artworks/my/:
    get:
      operationId: artworks_my_list
      description: Returns authenticated artist's own artworks including drafts and
        pending reviews.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - artworks
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArtworkListList'
          description: ''
  /api/v1/artworks/publish/:
    post:
      operationId: artworks_publish_create
      tags:
      - artworks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtworkCreateUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArtworkCreateUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArtworkCreateUpdate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtworkDetail'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedArtistProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedArtistProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedArtistProfile'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/register/request-code/:
    post:
      operationId: auth_register_request_code_create
      tags:
      - auth
      requestBody:
