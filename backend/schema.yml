          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArtworkDetail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArtworkDetail'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtworkDetail'
          description: ''
    patch:
      operationId: artworks_manage_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - artworks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedArtworkDetail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedArtworkDetail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedArtworkDetail'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
