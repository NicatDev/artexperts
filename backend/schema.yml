openapi: 3.0.3
info:
  title: Ilqar Mammadov Art Platform API
  version: 1.0.0
  description: Modular REST API for artworks, digital books, editorial articles, and
    creator accounts.
paths:
  /api/v1/articles/:
    get:
      operationId: articles_list
      description: Public editorial list. Returns only approved PUBLISHED articles.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - articles
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArticleListList'
          description: ''
  /api/v1/articles/{id}/manage/:
    get:
      operationId: articles_manage_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - articles
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleDetail'
          description: ''
    put:
      operationId: articles_manage_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - articles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleDetail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArticleDetail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArticleDetail'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleDetail'
          description: ''
    patch:
      operationId: articles_manage_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - articles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedArticleDetail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedArticleDetail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedArticleDetail'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleDetail'
          description: ''
    delete:
      operationId: articles_manage_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - articles
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/articles/{slug_or_id}/:
    get:
      operationId: articles_retrieve
      parameters:
      - in: path
        name: slug_or_id
        schema:
          type: string
        required: true
      tags:
      - articles
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleDetail'
          description: ''
  /api/v1/articles/categories/:
    get:
      operationId: articles_categories_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - articles
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArticleCategoryList'
          description: ''
  /api/v1/articles/my/:
    get:
      operationId: articles_my_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - articles
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArticleListList'
          description: ''
  /api/v1/articles/publish/:
    post:
      operationId: articles_publish_create
      tags:
      - articles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleCreateUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArticleCreateUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArticleCreateUpdate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleDetail'
          description: ''
  /api/v1/artists/:
    get:
      operationId: artists_list
      description: Public directory of artists with search and pagination.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - artists
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArtistProfileList'
          description: ''
  /api/v1/artists/{username}/:
    get:
      operationId: artists_retrieve
      description: Public profile of an individual artist.
      parameters:
      - in: path
        name: username
        schema:
          type: string
        required: true
      tags:
      - artists
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistProfile'
          description: ''
  /api/v1/artworks/:
    get:
      operationId: artworks_list
      description: Public artwork gallery. Shows only PUBLISHED, non-deleted artworks.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - artworks
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArtworkListList'
          description: ''
  /api/v1/artworks/{id}/:
