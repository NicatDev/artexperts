          description: ''
  /api/v1/artworks/{id}/download/:
    get:
      operationId: artworks_download_retrieve
      description: |-
        Controlled download endpoint.
        If the artist selected allow_download=False, this returns 403 Forbidden.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - artworks
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/artworks/{id}/manage/:
    get:
