      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/books/{slug_or_id}/:
    get:
      operationId: books_retrieve
      parameters:
      - in: path
        name: slug_or_id
        schema:
          type: string
        required: true
      tags:
      - books
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetail'
          description: ''
  /api/v1/books/my/:
    get:
      operationId: books_my_list
      parameters:
      - name: page
        required: false
